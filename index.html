<!doctype html>
<html lang="fo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aftur – keyp og sel brúkt í Føroyum</title>
<meta name="description" content="Aftur er føroyska keypitorgið fyri brúktar vørur. Keyp og sel klæðir, barnating, heimating og meira.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: white header (logo · search · actions) + category bar → content (home hero + grid, item page 2-col, forms) → footer */
:root{
  --bg:#ffffff; --soft:#f4f6fa; --line:#e3e7ef; --ink:#121826; --muted:#5d6678;
  --accent:#1c46a8; --accent-hover:#163a8c; --accent-soft:#e8eefb; --accent-ink:#ffffff;
  --red:#d23c32; --green:#14804a; --green-soft:#e5f4ec;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-top{display:flex;align-items:center;gap:16px;height:64px}
.logo{font-family:var(--display);font-weight:800;font-size:27px;letter-spacing:-.03em;color:var(--accent);flex:none}
.logo b{color:var(--red)}
.search{flex:1;min-width:0;display:flex;align-items:center;background:var(--soft);border-radius:10px;height:42px;padding:0 12px;gap:8px}
.search svg{width:18px;height:18px;flex:none;stroke:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.hdr-actions{display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{position:relative;width:42px;height:42px;border-radius:10px;border:0;background:none;display:grid;place-items:center}
.icon-btn:hover{background:var(--soft)}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn .n{position:absolute;top:4px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:600;white-space:nowrap}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-outline{background:var(--bg);border-color:var(--accent);color:var(--accent)}
.btn-outline:hover{background:var(--accent-soft)}
.btn-ghost{background:var(--bg);border-color:var(--line)}
.btn-ghost:hover{background:var(--soft)}
.btn-danger{background:var(--red);color:#fff}
.btn-block{width:100%;height:48px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:default}
.cats{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;height:46px;align-items:center}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;height:34px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
.cat:hover{background:var(--soft);color:var(--ink)}
.cat.on{background:var(--accent-soft);color:var(--accent)}
@media (max-width:640px){
  .hdr-top{flex-wrap:wrap;height:auto;padding-block:10px;gap:10px}
  .search{order:3;flex-basis:100%}
  .logo{flex:1}
  .sell-txt{display:none}
  .hdr-actions .btn{padding:0 12px}
}

/* hero */
.hero{margin-top:20px;border-radius:18px;background:var(--accent);color:#fff;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);overflow:hidden}
.hero-txt{padding:40px 40px 36px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4vw,44px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero p{margin:0;opacity:.88;max-width:40ch}
.hero .btn-primary{background:#fff;color:var(--accent)}
.hero .btn-primary:hover{background:var(--accent-soft)}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn-outline{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.hero .btn-outline:hover{background:rgba(255,255,255,.1)}
.hero-art{display:flex;gap:12px;padding:28px 28px 0;align-items:flex-end}
.hero-art div{flex:1;border-radius:14px 14px 0 0;background-size:cover;background-position:center;box-shadow:0 -4px 20px rgba(0,0,0,.15)}
.hero-art div:nth-child(1){height:200px}.hero-art div:nth-child(2){height:270px}.hero-art div:nth-child(3){height:230px}
.trust{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;opacity:.9}
.trust span{display:flex;align-items:center;gap:6px}
.trust svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-txt{padding:26px 22px 22px}.hero-art{display:none}}

/* feed */
.feed-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:30px 0 14px}
h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.count{color:var(--muted);font-size:14px;font-weight:500;margin-left:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.sel{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-size:14px;max-width:100%}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:24px 16px}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}}
.card{display:flex;flex-direction:column;gap:6px;min-width:0}
.card .ph{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
.card:hover .ph img{transform:scale(1.03)}
.fav{position:absolute;right:8px;bottom:8px;height:30px;padding:0 9px;border-radius:15px;border:0;background:rgba(255,255,255,.95);display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.fav svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2}
.fav.on svg{stroke:var(--red);fill:var(--red)}
.tagpill{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:#fff}
.card .brand{font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .t{font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.card .p{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.card .pp{font-size:12.5px;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:4px}
.card .pp svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2}
.empty{text-align:center;padding:60px 16px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:16px}

/* item page */
.crumbs{font-size:13px;color:var(--muted);margin:18px 0 14px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a:hover{color:var(--accent)}
.item{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:32px;align-items:start}
@media (max-width:820px){.item{grid-template-columns:1fr;gap:20px}}
.gallery{display:grid;gap:8px}
.gallery .main{aspect-ratio:4/5;max-height:640px;width:100%;border-radius:var(--r);overflow:hidden;background:var(--soft)}
.gallery .main img{width:100%;height:100%;object-fit:contain}
.thumbs{display:flex;gap:8px;overflow-x:auto}
.thumbs button{flex:none;width:68px;height:84px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--soft)}
.thumbs button.on{border-color:var(--accent)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.panel{position:sticky;top:130px;display:flex;flex-direction:column;gap:16px;border:1px solid var(--line);border-radius:16px;padding:22px}
@media (max-width:820px){.panel{position:static}}
.panel .price{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.panel .withfee{font-size:14px;color:var(--accent);font-weight:600;margin-top:6px;display:flex;gap:6px;align-items:center}
.panel .withfee svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.panel h1{font-size:20px;margin:0;font-weight:700;line-height:1.3;text-wrap:balance}
.specs{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:14px}
.specs dt{color:var(--muted)}
.specs dd{margin:0;font-weight:500}
.desc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.seller{display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.seller .nm{font-weight:600}
.seller .sub{font-size:13px;color:var(--muted)}
.note{border-radius:10px;padding:12px 14px;font-size:14px;background:var(--soft)}
.note.green{background:var(--green-soft);color:var(--green)}
.note.blue{background:var(--accent-soft);color:var(--accent)}
.protect{display:flex;gap:10px;font-size:13px;color:var(--muted);align-items:flex-start}
.protect svg{width:20px;height:20px;flex:none;stroke:var(--accent);fill:none;stroke-width:2}
.more{margin-top:44px}

/* forms */
.page{max-width:720px;margin:24px auto 0}
.page h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0 0 20px}
.box{border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
.box h3{margin:0;font-size:16px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-weight:600;font-size:14px}
.field .hint{font-size:13px;color:var(--muted)}
.field .err{font-size:13px;color:var(--red);font-weight:600}
.inp{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px}
textarea.inp{height:auto;min-height:110px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.photos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:520px){.photos{grid-template-columns:repeat(3,minmax(0,1fr))}}
.photos .ph{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--soft)}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:13px;border:0;background:rgba(255,255,255,.95);font-weight:700}
.photos .first{position:absolute;left:5px;bottom:5px;font-size:11px;font-weight:700;background:var(--ink);color:#fff;padding:1px 6px;border-radius:5px}
.addph{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:10px;background:var(--bg);color:var(--accent);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.addph svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8}
.addph:hover{background:var(--accent-soft)}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:24px;align-items:start;max-width:1000px;margin:24px auto 0}
@media (max-width:820px){.co{grid-template-columns:1fr}}
.co h1{grid-column:1/-1;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;margin:0}
.mini{display:flex;gap:14px;align-items:center}
.mini img{width:64px;height:80px;border-radius:8px;object-fit:cover;flex:none;background:var(--soft)}
.mini .t{font-weight:600}
.mini .s{font-size:13px;color:var(--muted)}
.opt{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex:none}
.opt .l{flex:1;min-width:0}
.opt .l b{display:block;font-weight:600}
.opt .l span{font-size:13px;color:var(--muted)}
.opt .r{font-weight:600;font-variant-numeric:tabular-nums}
.sum{display:grid;grid-template-columns:1fr auto;gap:10px 0;font-size:14.5px;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:800;font-size:18px;padding-top:12px;border-top:1px solid var(--line)}
.sum .tot+.tot{border:0;padding-top:12px}
.sum span:nth-child(even){text-align:right;padding-left:12px}
@media (max-width:560px){.filters{width:100%;display:grid;grid-template-columns:1fr 1fr}.filters .sel:last-child{grid-column:1/-1}}
.demo{font-size:12.5px;color:var(--muted);text-align:center}

/* orders / mine */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;flex-wrap:wrap}
.row img{width:60px;height:74px;border-radius:8px;object-fit:cover;flex:none;background:var(--soft)}
.row .info{flex:1;min-width:150px}
.row .info .t{font-weight:600}
.row .info .s{font-size:13px;color:var(--muted)}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
.row .acts .btn{height:36px;padding:0 12px;font-size:13.5px}
.status{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--muted)}
.status.ok{background:var(--green-soft);color:var(--green)}
.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-color:var(--accent)}

.done{text-align:center;max-width:520px;margin:50px auto 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.done .ok{width:64px;height:64px;border-radius:32px;background:var(--green-soft);display:grid;place-items:center}
.done .ok svg{width:32px;height:32px;stroke:var(--green);fill:none;stroke-width:2.5}
.done h1{font-family:var(--display);font-weight:800;font-size:30px;margin:0}

footer{margin-top:64px;border-top:1px solid var(--line);background:var(--soft)}
footer .wrap{padding-block:28px;display:flex;gap:16px 40px;flex-wrap:wrap;justify-content:space-between;font-size:13.5px;color:var(--muted)}
footer .logo{font-size:22px}
footer a:hover{color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap hdr-top">
    <a class="logo" href="#/" aria-label="Aftur – forsíða">aftur<b>.</b></a>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Leita eftir vørum ella merkjum" aria-label="Leita">
    </label>
    <div class="hdr-actions">
      <a class="icon-btn" href="#/favs" aria-label="Yndislisti"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9-8.6C1.6 8.3 3.5 5 6.8 5c2 0 3.4 1.1 5.2 3 1.8-1.9 3.2-3 5.2-3 3.3 0 5.2 3.3 3.8 6.4C19 15.6 12 20 12 20z"/></svg><span class="n" id="favN" hidden></span></a>
      <a class="icon-btn" href="#/me" aria-label="Mín síða"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></a>
      <a class="btn btn-primary" href="#/sell"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="sell-txt">Sel nú</span></a>
    </div>
  </div>
  <nav class="wrap cats" id="cats" aria-label="Bólkar"></nav>
</header>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap">
    <div><div class="logo">aftur<b>.</b></div><div style="margin-top:6px;max-width:34ch">Føroyska keypitorgið fyri brúktar vørur. Gev tínum lutum eitt nýtt lív.</div></div>
    <div style="display:flex;flex-direction:column;gap:6px"><b style="color:var(--ink)">Aftur</b><a href="#/how">Soleiðis virkar tað</a><a href="#/how">Keyparavernd</a></div>
    <div style="display:flex;flex-direction:column;gap:6px"><b style="color:var(--ink)">Konta</b><a href="#/sell">Sel ein lut</a><a href="#/me">Mínar lýsingar</a><a href="#/me/orders">Mínir keyp</a></div>
  </div>
</footer>

<script>
(function(){
"use strict";

/* ======================================================== */

const CATS=[["klaedir","Klæðir"],["born","Børn"],["heim","Heim & hús"],["itrottur","Ítróttur & frílív"],["elektronikk","Elektronikk"],["farkostir","Bilar & bátar"],["bokur","Bøkur & spøl"],["annad","Annað"]];

const STORE="aftur.v1";

/* ---------- placeholder art for example items ---------- */
const ART={
 shirt:"M38 22l-16 9 6 13 10-4v40h24V40l10 4 6-13-16-9c-2 5-7 8-12 8s-10-3-12-8z",
 jacket:"M38 20l-14 8-4 52h20V44M62 20l14 8 4 52H60V44M38 20c3 6 7 9 12 9s9-3 12-9M50 29v51M44 50h-4M60 50h-4",
 sweater:"M36 22l-18 10-2 40h14l2-30v38h36V42l2 30h14l-2-40-18-10c-3 4-8 6-14 6s-11-2-14-6zM32 72h36",
 dress:"M42 18v12l-6 8 -10 42h48L64 38l-6-8V18M42 30h16",
 shoe:"M18 70V52l14-4 8-14h10l2 12c10 4 22 6 30 10v14zM18 64h64",

async function shrink(f){
  const url=URL.createObjectURL(f);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const m=1000,s=Math.min(1,m/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",.78);
  }finally{URL.revokeObjectURL(url)}
}

/* ---------- router ---------- */
let PATH=(location.hash||"").replace(/^#\/?/,"");
function go(href){
  PATH=String(href).replace(/^#\/?/,"");
  try{history.pushState(null,"","#/"+PATH)}catch(e){}
  route();
}
document.addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest('a[href^="#"]');
  if(!a||e.defaultPrevented||e.metaKey||e.ctrlKey||e.shiftKey)return;
  e.preventDefault();go(a.getAttribute("href"));
});
let LAST=null;
function route(){
  const app=document.getElementById("app");
  const p=PATH.split("/");
  const keepScroll=LAST===PATH;LAST=PATH;
  const y=window.scrollY;
  app.replaceChildren();
  document.getElementById("cats").hidden=!["","item"].includes(p[0]);
  if(p[0]==="item")vItem(app,p[1]);
  else if(p[0]==="sell")vSell(app);
  else if(p[0]==="buy")vBuy(app,p[1]);
  else if(p[0]==="order")vOrder(app,p[1]);
  else if(p[0]==="favs")vFavs(app);
  else if(p[0]==="me")vMe(app,p[1]);
  else if(p[0]==="how")vHow(app);
  else vHome(app);
  updateBadges();
  window.scrollTo(0,keepScroll?y:0);
}
window.addEventListener("popstate",()=>{PATH=(location.hash||"").replace(/^#\/?/,"");route()});
window.addEventListener("hashchange",()=>{const n=(location.hash||"").replace(/^#\/?/,"");if(n!==PATH){PATH=n;route()}});
buildCats();route();
})();
